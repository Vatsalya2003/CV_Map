<!--
index.html

Vatsalya Dabhi and Aditya Pandita
CS 5330 - Final Project

Phone-facing page for the obstacle guidance web app. Opens the rear
camera, sends a frame to the Flask server every ~600ms, draws the
returned boxes/decision on top of the live video, and speaks the
decision out loud using the browser's built-in text-to-speech. This
mirrors guidance.py's debounce logic (only speak on change or after a
cooldown) but in JavaScript, since it runs in the browser instead of Python.
-->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Obstacle Guidance</title>
  <style>
    body { margin: 0; background: #000; font-family: -apple-system, sans-serif; }
    #wrap { position: relative; width: 100%; height: 100vh; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }

    /* The big, high-contrast decision banner - this is the actual UI a
       visually impaired user needs to be able to glance at (or have a
       sighted helper glance at) and immediately understand. Bounding
       boxes and small debug text are for us, not for a real user, so
       they stay small and out of the way at the bottom of the screen. */
    #banner {
      position: absolute; top: 0; left: 0; right: 0;
      padding: 28px 12px; text-align: center; z-index: 10;
      font-size: 15vw; font-weight: 900; line-height: 1;
      font-family: -apple-system, sans-serif;
      color: #fff; background: rgba(0, 0, 0, 0.55);
      transition: background-color 0.2s;
    }
    #banner.clear { background: rgba(0, 120, 0, 0.65); }
    #banner.move  { background: rgba(200, 130, 0, 0.7); }
    #banner.stop  { background: rgba(180, 0, 0, 0.75); }

    #debugStatus {
      position: absolute; bottom: 50px; left: 10px; right: 10px;
      color: #0f0; font-size: 14px; text-shadow: 1px 1px 3px black; z-index: 10;
    }
    #speakIndicator {
      position: absolute; bottom: 20px; left: 10px;
      color: #0f0; font-size: 14px; text-shadow: 1px 1px 3px black; z-index: 10;
    }
    #startBtn {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      padding: 16px 24px; font-size: 18px; z-index: 20;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="banner">TAP START</div>
    <div id="debugStatus"></div>
    <div id="speakIndicator"></div>
    <button id="startBtn">Start</button>
  </div>

<script>
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const ctx = overlay.getContext("2d");
const banner = document.getElementById("banner");
const debugStatus = document.getElementById("debugStatus");
const speakIndicator = document.getElementById("speakIndicator");
const startBtn = document.getElementById("startBtn");

// Maps the pipeline's decision strings (from zones.py's decide()) to
// short, large-print text plus a color class, since "path clear" or
// "obstacle left, move right" is too long to read at a glance in giant
// font. Colour is a redundant cue on top of the text, not a replacement
// for it, so this stays usable for colorblind users too.
const DECISION_DISPLAY = {
  "path clear":               { text: "PATH CLEAR", cls: "clear" },
  "obstacle left, move right": { text: "MOVE RIGHT", cls: "move" },
  "obstacle right, move left": { text: "MOVE LEFT",  cls: "move" },
  "stop":                     { text: "STOP", cls: "stop" },
};

function updateBanner(decision) {
  const display = DECISION_DISPLAY[decision] || { text: decision.toUpperCase(), cls: "move" };
  banner.textContent = display.text;
  banner.className = display.cls;
}

// Mirrors guidance.py: only speak when the decision changes, or when
// this many seconds have passed since we last spoke it.
const COOLDOWN_SECONDS = 1.5;
let lastDecision = null;
let lastSpokenTime = 0;

function speakIfNeeded(decision) {
  const now = Date.now() / 1000;
  const changed = decision !== lastDecision;
  const cooldownPassed = (now - lastSpokenTime) >= COOLDOWN_SECONDS;

  if (changed || cooldownPassed) {
    lastDecision = decision;
    lastSpokenTime = now;
    const utterance = new SpeechSynthesisUtterance(decision);
    // Visible proof that speak() was actually called, so if there's
    // still no sound we know it's a device/volume issue (e.g. silent
    // switch, low volume) rather than the code never calling speak().
    utterance.onstart = () => { speakIndicator.textContent = "🔊 speaking: " + decision; };
    utterance.onend = () => { speakIndicator.textContent = ""; };
    speechSynthesis.speak(utterance);
  }
}

function drawResults(data) {
  overlay.width = video.videoWidth;
  overlay.height = video.videoHeight;
  ctx.clearRect(0, 0, overlay.width, overlay.height);

  // Scale factor between the frame we sent (data.frame_width) and the
  // canvas we're drawing on (overlay.width), in case they differ.
  const scaleX = overlay.width / data.frame_width;
  const scaleY = overlay.height / data.frame_height;

  ctx.strokeStyle = "#00ff00";
  ctx.lineWidth = 2;
  ctx.font = "16px sans-serif";
  ctx.fillStyle = "#00ff00";

  for (const box of data.boxes) {
    const x1 = box.x1 * scaleX, y1 = box.y1 * scaleY;
    const x2 = box.x2 * scaleX, y2 = box.y2 * scaleY;
    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
    ctx.fillText(`${box.label} ${box.conf.toFixed(2)}`, x1, y1 > 20 ? y1 - 5 : y1 + 15);
  }

  updateBanner(data.decision);
  debugStatus.textContent =
    `decision: ${data.decision}  |  left: ${data.left_status}  |  right: ${data.right_status}`;
}

async function captureAndSend() {
  const captureCanvas = document.createElement("canvas");
  captureCanvas.width = video.videoWidth;
  captureCanvas.height = video.videoHeight;
  captureCanvas.getContext("2d").drawImage(video, 0, 0);

  captureCanvas.toBlob(async (blob) => {
    const formData = new FormData();
    formData.append("frame", blob, "frame.jpg");

    try {
      const response = await fetch("/process", { method: "POST", body: formData });
      const data = await response.json();
      drawResults(data);
      speakIfNeeded(data.decision);
    } catch (err) {
      banner.textContent = "Error reaching server: " + err; banner.className = "stop";
    }
  }, "image/jpeg", 0.8);
}

startBtn.addEventListener("click", async () => {
  // iOS Safari only allows speechSynthesis.speak() to produce sound if
  // speak() has been called synchronously inside a real user gesture
  // (like this click) at least once first. Our actual guidance speech
  // happens later, inside an async fetch response, which is too far
  // removed from the click for iOS to allow - it fails completely
  // silently, no error, no sound. Speaking one empty/silent utterance
  // right here, directly inside the click handler, unlocks audio for
  // every speak() call for the rest of the page's lifetime.
  speechSynthesis.speak(new SpeechSynthesisUtterance(""));

  // Any error in here (camera permission denied, no HTTPS, no camera
  // found, etc.) used to fail silently and just leave a black screen.
  // Now we catch it and show the real error message on screen instead.
  try {
    if (!window.isSecureContext) {
      throw new Error("Page is not a secure context (needs https://). " +
        "Did you accept the certificate warning for this exact URL?");
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error("navigator.mediaDevices.getUserMedia is unavailable in this browser.");
    }

    banner.textContent = "Requesting camera access...";

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } },
      audio: false,
    });
    video.srcObject = stream;
    await video.play();

    startBtn.style.display = "none";
    banner.textContent = "Camera on...";

    // Loop: capture + send + wait, repeat. Using setTimeout instead of
    // a fixed interval so we don't pile up requests if the server is
    // slower than 600ms on a given frame.
    async function loop() {
      await captureAndSend();
      setTimeout(loop, 600);
    }
    loop();
  } catch (err) {
    banner.textContent = "Camera error: " + err.message; banner.className = "stop";
    console.error(err);
  }
});
</script>
</body>
</html>
